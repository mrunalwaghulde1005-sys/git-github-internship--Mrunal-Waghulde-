<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f7f3">
    <title>Sign in</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="login-box">
      <h1>Welcome back</h1>
      <p class="intro">Sign in to continue to your account.</p>

      <form id="login-form" novalidate>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email"
                 placeholder="name@example.com"
                 autocomplete="email"
                 aria-describedby="email-error"
                 required>
          <p class="error" id="email-error"></p>
        </div>

        <div class="field">
          <div class="password-heading">
            <label for="password">Password</label>
            <button class="text-button" id="forgot-password" type="button">
              Forgot password?
            </button>
          </div>

          <div class="password-control">
            <input id="password" name="password" type="password"
                   placeholder="At least 6 characters"
                   minlength="6"
                   autocomplete="current-password"
                   aria-describedby="password-error"
                   required>

            <button class="show-password" id="toggle-password"
                    type="button"
                    aria-label="Show password"
                    aria-pressed="false">
              Show
            </button>
          </div>

          <p class="error" id="password-error"></p>
        </div>

        <button class="submit-button" type="submit">
          Log in <span aria-hidden="true">&rarr;</span>
        </button>

        <p class="form-message" id="message"
           role="status" aria-live="polite"></p>
      </form>

      <p class="demo-note">A simple, secure-looking sign-in demo.</p>
    </main>
  </body>
</html>
